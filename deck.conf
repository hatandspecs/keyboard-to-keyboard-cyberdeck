# deck.conf — how to build the SD card for the cyberdeck.
#
# This file describes the *machine*: hostname, account, WiFi country, display
# and keyboard. What the station calls itself and how it operates lives in
# cyberdeck.conf, which is installed alongside it. Credentials live in
# deck.secrets, which is gitignored.
#
# Same form as the iGate project's pi.conf: KEY = value, '#' comments.

# --- The card ---
DECK_IMAGE_VARIANT = armhf        # armhf | arm64. 512 MB on a 3A+ wants armhf
DECK_IMAGE_PATH =                 # a downloaded .img.xz to reuse; blank = fetch
DECK_HOSTNAME = cyberdeck
DECK_USER = deck
DECK_INSTALL_DIR = cyberdeck      # under /opt

# --- Locale ---
DECK_WIFI_COUNTRY = US
DECK_TIMEZONE = America/New_York
DECK_KEYBOARD = us
DECK_LOCALE = C.UTF-8

# --- Display ---
# The Waveshare 5" DSI LCD, 800x480. The "7inch" in the overlay name is not a
# mistake and must not be "corrected": Waveshare's 800x480 DSI panels match the
# official Raspberry Pi 7" panel's DSI timing, so they use its overlay. This is
# the line Waveshare's own documentation specifies for this display.
#   - vc4-kms-dsi-waveshare-panel is for their panels that are NOT 800x480
#     (2.8", 4.0", 7.9", 8.8" ...); there is no 5_0_inch parameter.
#   - the ",dsi0" variant is for the second DSI interface, Pi 5 / CM4 only.
# The build also asserts dtoverlay=vc4-kms-v3d ahead of this one.
DECK_PANEL_OVERLAY = vc4-kms-dsi-7inch
DECK_CONSOLE_FONT = Uni3-TerminusBold24x12   # 66x20 on 800x480
DECK_HIDE_BOOT_MESSAGES = yes                # quiet boot, no cursor, no getty

# --- Bluetooth keyboard ---
# Pairing has no interface on a headless appliance, so the keyboard is named
# here and paired by the first-boot script. The MAC is what bluetoothctl
# reports; DECK_BT_KEYBOARD_NAME is only used in messages.
#
# Put the keyboard in pairing mode before the deck's first boot. If it is not
# found, first boot retries on a timer rather than giving up, and the deck can
# still be reached over SSH.
DECK_BT_KEYBOARD = DF:3C:77:61:6C:21
DECK_BT_KEYBOARD_NAME = Pebble K380s
DECK_BT_PAIR_TIMEOUT = 120        # seconds to look for it on each attempt

# --- Radio ---
# The FTX-1 presents CAT, PTT and a codec over one USB-C cable.
#
# Model 1051 is hamlib's native FTX-1 backend, added in 4.7.1 and still marked
# Beta. It is NOT in the 4.6.2 that Raspberry Pi OS Trixie ships — that version
# has no FTX-1 at all, and the nearest models that read this radio (1035
# FT-991, 1049 FT-710, 1042 FTDX-10) all send a frequency command one digit
# short, which the radio discards without an error. See design_doc.md §7.1 and
# Hamlib issue #2219. Build 4.7.2 from source; DECK_RIGCTLD points at it.
DECK_RIG_MODEL = 1051
DECK_RIGCTLD = /usr/local/bin/rigctld

# Built from source at first boot, because no packaged version has the FTX-1
# backend. Adds 20-30 minutes to the first boot on a 3A+. Set empty to skip and
# live with the packaged hamlib, which cannot set this radio's frequency.
DECK_HAMLIB_VERSION = 4.7.2
DECK_HAMLIB_SHA256 = ae1fcf2dbc80ea0786ea8f047b09399c3f7737d1930442f61a031708ed33e88f

# Paths under /dev/serial/by-id survive a re-enumeration; /dev/ttyUSB0 does
# not. Power-cycling the radio detaches the CP2105 and the kernel hands out
# the next free numbers, so CAT moves to ttyUSB1 and the service — which has
# ConditionPathExists on the old path — silently stops running.
#
# The serial number in these paths (01A98B08) belongs to THIS radio's CP2105.
# A different FTX-1 has a different one — read the real names off the deck with
#     ls -l /dev/serial/by-id/
# -if00 is CAT, -if01 is the second UART. That distinction is why by-id beats
# matching on USB vendor:product, which cannot tell two identical UARTs apart.
DECK_CAT_DEVICE = /dev/serial/by-id/usb-Silicon_Labs_CP2105_Dual_USB_to_UART_Bridge_Controller_01A98B08-if00-port0
DECK_CAT_BAUD = 38400
DECK_PTT_DEVICE = /dev/serial/by-id/usb-YAESUMUSEN_YAESU_HRI_USB_I_F_0000000000001-if00
DECK_AUDIO_DEVICE = plughw:1,0

# --- Behavior ---
DECK_AUTOSTART = yes              # start the terminal on tty1 at boot
DECK_SSH = yes                    # keep SSH, for updates and recovery
DECK_RUN_TMPFS_SIZE = 32M
